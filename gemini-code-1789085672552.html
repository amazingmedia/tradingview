<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Multi-Timeframe Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background-color: #ffffff; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Top Control Bar */
    .top-bar {
      height: 40px;
      background-color: #f8f9fd;
      border-bottom: 1px solid #e0e3eb;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 15px;
    }

    .top-bar label {
      font-size: 13px;
      font-weight: 600;
      color: #131722;
    }

    .top-bar select {
      padding: 4px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #c1c4cd;
      background-color: #ffffff;
      outline: none;
      cursor: pointer;
    }

    /* Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: calc(100vh - 40px);
      gap: 2px;
      background-color: #e0e3eb;
    }

    .chart-box { 
      width: 100%; 
      height: 100%; 
      position: relative;
    }

    iframe {
      width: 100% !important;
      height: 100% !important;
    }

    /* Symbol Search Pop-up Scaling */
    div[class*="dialog-"], 
    div[class*="overlap-manager-"] {
      transform: scale(0.85) !important;
      transform-origin: top left !important;
    }
  </style>
</head>
<body>

  <!-- Top Bar for Quick Symbol Switch -->
  <div class="top-bar">
    <label for="symbolSelect">Change All Charts Symbol:</label>
    <select id="symbolSelect" onchange="changeAllSymbols(this.value)">
      <option value="FX:XAUUSD" selected>GOLD (XAUUSD)</option>
      <option value="FOREXCOM:DXY">DXY (US Dollar Index)</option>
      <option value="FX:EURUSD">EURUSD</option>
      <option value="FX:GBPUSD">GBPUSD</option>
      <option value="FX:USDJPY">USDJPY</option>
      <option value="CAPITALCOM:US100">NAS100 (US100)</option>
      <option value="CAPITALCOM:US30">US30</option>
    </select>
  </div>

  <!-- 4-Chart Grid -->
  <div class="grid-container">
    <div id="chart_4h" class="chart-box"></div>
    <div id="chart_1h" class="chart-box"></div>
    <div id="chart_15m" class="chart-box"></div>
    <div id="chart_5m" class="chart-box"></div>
  </div>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    const timeframes = [
      { id: "chart_4h", interval: "240" },
      { id: "chart_1h", interval: "60" },
      { id: "chart_15m", interval: "15" },
      { id: "chart_5m", interval: "5" }
    ];

    let currentSymbol = "FX:XAUUSD";

    function loadCharts(symbol) {
      timeframes.forEach(tf => {
        document.getElementById(tf.id).innerHTML = "";
        new TradingView.widget({
          "autosize": true,
          "symbol": symbol,
          "interval": tf.interval,
          "timezone": "Asia/Bangkok",
          "theme": "light",
          "style": "1",
          "locale": "en",
          "toolbar_bg": "#f1f3f6",
          "enable_publishing": false,
          "hide_side_toolbar": false,
          "allow_symbol_change": true,
          "save_image": true,
          "details": false,
          "hotlist": false,
          "calendar": false,
          "container_id": tf.id,
          "popup_width": "850",
          "popup_height": "550",
          "studies": [],
          "disabled_features": [
            "create_volume_indicator_by_default"
          ],
          // ပုံပါ Menu Setting အတိုင်း အတိအကျ ပြင်ဆင်ထားသော အပိုင်း
          "overrides": {
            "paneProperties.legendProperties.showSeriesTitle": true,        // ✓ Symbol title (On)
            "paneProperties.legendProperties.showSeriesOHLC": false,       // Chart values (Off)
            "paneProperties.legendProperties.showBarChange": false,        // Bar change values (Off)
            "paneProperties.legendProperties.showVolume": false,           // Volume (Off)
            "paneProperties.legendProperties.showStudyTitles": false,      // Indicator titles (Off)
            "paneProperties.legendProperties.showStudyArguments": false,   // Indicator inputs (Off)
            "paneProperties.legendProperties.showStudyValues": false       // Indicator values (Off)
          }
        });
      });
    }

    function changeAllSymbols(newSymbol) {
      currentSymbol = newSymbol;
      loadCharts(currentSymbol);
    }

    // Initial Load
    loadCharts(currentSymbol);
  </script>

</body>
</html>
